<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 595" role="img" aria-labelledby="title"><title id="title">도구 호출이 사라지는 경로와 이를 보존하는 브리지의 차이</title><rect width="600" height="595" rx="16" fill="#151e29"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans KR,sans-serif"><text x="28" y="38" font-size="24" fill="#e1eaf2" font-weight="700" text-anchor="start">토큰은 생성됐는데 도구 호출이 없다면</text><text x="155" y="86" font-size="23" fill="#ee9995" font-weight="700" text-anchor="middle">수정 전</text><text x="445" y="86" font-size="23" fill="#7ad5bd" font-weight="700" text-anchor="middle">브리지 적용 후</text><rect x="25" y="110" width="260" height="80" rx="10" fill="#1c2835" stroke="#79505a" stroke-width="1.5"/><text x="155.0" y="141" font-size="22" fill="#e1eaf2" font-weight="600" text-anchor="middle">도구 선언 없음</text><text x="155.0" y="168" font-size="17" fill="#9fb1c4" font-weight="400" text-anchor="middle">Cline은 XML을 기대</text><path d="M155 190L155 220" stroke="#ee9995" stroke-width="2" fill="none"/><path d="M151.16459569116637 212.97933950487703L155 220L158.83540430883363 212.97933950487703" stroke="#ee9995" stroke-width="2" fill="none"/><rect x="25" y="220" width="260" height="80" rx="10" fill="#1c2835" stroke="#79505a" stroke-width="1.5"/><text x="155.0" y="251" font-size="22" fill="#e1eaf2" font-weight="600" text-anchor="middle">모델은 고유 형식 출력</text><text x="155.0" y="278" font-size="17" fill="#9fb1c4" font-weight="400" text-anchor="middle">vLLM이 도구 호출로 파싱</text><path d="M155 300L155 330" stroke="#ee9995" stroke-width="2" fill="none"/><path d="M151.16459569116637 322.97933950487703L155 330L158.83540430883363 322.97933950487703" stroke="#ee9995" stroke-width="2" fill="none"/><rect x="25" y="330" width="260" height="80" rx="10" fill="#1c2835" stroke="#79505a" stroke-width="1.5"/><text x="155.0" y="361" font-size="22" fill="#e1eaf2" font-weight="600" text-anchor="middle">호출 결과 제거</text><text x="155.0" y="388" font-size="17" fill="#9fb1c4" font-weight="400" text-anchor="middle">선언되지 않은 도구</text><path d="M155 410L155 440" stroke="#ee9995" stroke-width="2" fill="none"/><path d="M151.16459569116637 432.97933950487703L155 440L158.83540430883363 432.97933950487703" stroke="#ee9995" stroke-width="2" fill="none"/><rect x="25" y="440" width="260" height="80" rx="10" fill="#33272d" stroke="#79505a" stroke-width="1.5"/><text x="155.0" y="471" font-size="22" fill="#e1eaf2" font-weight="600" text-anchor="middle">클라이언트는 빈 응답</text><text x="155.0" y="498" font-size="17" fill="#9fb1c4" font-weight="400" text-anchor="middle">다음 작업으로 못 넘어감</text><rect x="315" y="110" width="260" height="80" rx="10" fill="#1c2835" stroke="#334454" stroke-width="1.5"/><text x="445.0" y="141" font-size="22" fill="#e1eaf2" font-weight="600" text-anchor="middle">도구 정보 선언</text><text x="445.0" y="168" font-size="17" fill="#9fb1c4" font-weight="400" text-anchor="middle">프롬프트에서 추출</text><path d="M445 190L445 220" stroke="#7ad5bd" stroke-width="2" fill="none"/><path d="M441.16459569116637 212.97933950487703L445 220L448.83540430883363 212.97933950487703" stroke="#7ad5bd" stroke-width="2" fill="none"/><rect x="315" y="220" width="260" height="80" rx="10" fill="#1c2835" stroke="#334454" stroke-width="1.5"/><text x="445.0" y="251" font-size="22" fill="#e1eaf2" font-weight="600" text-anchor="middle">파서의 호출 결과 보존</text><text x="445.0" y="278" font-size="17" fill="#9fb1c4" font-weight="400" text-anchor="middle">tools + auto</text><path d="M445 300L445 330" stroke="#7ad5bd" stroke-width="2" fill="none"/><path d="M441.16459569116637 322.97933950487703L445 330L448.83540430883363 322.97933950487703" stroke="#7ad5bd" stroke-width="2" fill="none"/><rect x="315" y="330" width="260" height="80" rx="10" fill="#1c2835" stroke="#334454" stroke-width="1.5"/><text x="445.0" y="361" font-size="22" fill="#e1eaf2" font-weight="600" text-anchor="middle">XML 텍스트로 변환</text><text x="445.0" y="388" font-size="17" fill="#9fb1c4" font-weight="400" text-anchor="middle">Cline이 읽는 형식</text><path d="M445 410L445 440" stroke="#7ad5bd" stroke-width="2" fill="none"/><path d="M441.16459569116637 432.97933950487703L445 440L448.83540430883363 432.97933950487703" stroke="#7ad5bd" stroke-width="2" fill="none"/><rect x="315" y="440" width="260" height="80" rx="10" fill="#1c2835" stroke="#334454" stroke-width="1.5"/><text x="445.0" y="471" font-size="22" fill="#e1eaf2" font-weight="600" text-anchor="middle">도구 실행으로 연결</text><text x="445.0" y="498" font-size="17" fill="#9fb1c4" font-weight="400" text-anchor="middle">알려진 도구 범위에서</text><text x="300" y="575" font-size="17" fill="#9fb1c4" font-weight="400" text-anchor="middle">전체 요청이 아닌 Cline XML 도구 경로에 적용</text></g></svg>