<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 510" role="img" aria-labelledby="title"><title id="title">코딩 에이전트는 도구 실행 결과를 다시 모델에 보내며 작업을 이어간다</title><rect width="600" height="510" rx="16" fill="#151e29"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans KR,sans-serif"><text x="30" y="38" font-size="24" fill="#e1eaf2" font-weight="700" text-anchor="start">질문 한 번에도 모델 호출은 여러 번</text><rect x="60" y="70" width="455" height="80" rx="10" fill="#1c2835" stroke="#334454" stroke-width="1.5"/><text x="287.5" y="101" font-size="22" fill="#e1eaf2" font-weight="600" text-anchor="middle">사용자의 작업 지시</text><text x="287.5" y="128" font-size="17" fill="#9fb1c4" font-weight="400" text-anchor="middle">“오류를 찾아서 고쳐 줘”</text><rect x="60" y="180" width="455" height="80" rx="10" fill="#1c2835" stroke="#334454" stroke-width="1.5"/><text x="287.5" y="211" font-size="22" fill="#e1eaf2" font-weight="600" text-anchor="middle">모델의 도구 실행 요청</text><text x="287.5" y="238" font-size="17" fill="#9fb1c4" font-weight="400" text-anchor="middle">파일 읽기 · 검색 · 명령 실행</text><rect x="60" y="290" width="455" height="80" rx="10" fill="#1c2835" stroke="#334454" stroke-width="1.5"/><text x="287.5" y="321" font-size="22" fill="#e1eaf2" font-weight="600" text-anchor="middle">코딩 클라이언트에서 실행</text><text x="287.5" y="348" font-size="17" fill="#9fb1c4" font-weight="400" text-anchor="middle">실제 파일과 실행 환경에 접근</text><rect x="60" y="400" width="455" height="80" rx="10" fill="#1c2835" stroke="#334454" stroke-width="1.5"/><text x="287.5" y="431" font-size="22" fill="#e1eaf2" font-weight="600" text-anchor="middle">실행 결과를 다시 모델로</text><text x="287.5" y="458" font-size="17" fill="#9fb1c4" font-weight="400" text-anchor="middle">결과를 보고 다음 행동 결정</text><path d="M285 150L285 180" stroke="#7ad5bd" stroke-width="2" fill="none"/><path d="M281.16459569116637 172.97933950487703L285 180L288.83540430883363 172.97933950487703" stroke="#7ad5bd" stroke-width="2" fill="none"/><path d="M285 260L285 290" stroke="#7ad5bd" stroke-width="2" fill="none"/><path d="M281.16459569116637 282.97933950487703L285 290L288.83540430883363 282.97933950487703" stroke="#7ad5bd" stroke-width="2" fill="none"/><path d="M285 370L285 400" stroke="#7ad5bd" stroke-width="2" fill="none"/><path d="M281.16459569116637 392.97933950487703L285 400L288.83540430883363 392.97933950487703" stroke="#7ad5bd" stroke-width="2" fill="none"/><path d="M515 440H560V220H515" stroke="#7ad5bd" stroke-width="2" fill="none" stroke-dasharray="6 5"/><path d="M552 220L515 220" stroke="#7ad5bd" stroke-width="2" fill="none"/><path d="M522.020660495123 216.16459569116637L515 220L522.020660495123 223.83540430883363" stroke="#7ad5bd" stroke-width="2" fill="none"/><text x="548" y="330" font-size="18" fill="#7ad5bd" font-weight="600" text-anchor="middle">반복</text></g></svg>