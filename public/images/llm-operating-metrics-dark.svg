<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 720" role="img" aria-labelledby="title"><title id="title">6월과 11월의 요청량과 평균 입력, p95 응답 시간을 독립 축으로 비교</title><rect width="620" height="720" rx="16" fill="#151e29"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans KR,sans-serif"><text x="30" y="38" font-size="24" fill="#e1eaf2" font-weight="700" text-anchor="start">운영에서 달라진 세 가지 숫자</text><text x="30" y="68" font-size="17" fill="#9fb1c4" font-weight="400" text-anchor="start">6월과 11월 집계 비교 · 항목마다 별도 축</text><text x="30" y="115" font-size="22" fill="#e1eaf2" font-weight="600" text-anchor="start">일평균 요청</text><text x="585" y="115" font-size="20" fill="#7ad5bd" font-weight="600" text-anchor="end">약 37배</text><text x="30" y="163" font-size="18" fill="#9fb1c4" font-weight="400" text-anchor="start">6월</text><rect x="100" y="145" width="350" height="26" rx="3" fill="#243442"/><rect x="100" y="145" width="9.086" height="26" rx="3" fill="#496573"/><text x="585" y="165" font-size="18" fill="#e1eaf2" font-weight="500" text-anchor="end">649건</text><text x="30" y="210" font-size="18" fill="#9fb1c4" font-weight="400" text-anchor="start">11월</text><rect x="100" y="192" width="350" height="26" rx="3" fill="#243442"/><rect x="100" y="192" width="335.356" height="26" rx="3" fill="#7ad5bd"/><text x="585" y="212" font-size="18" fill="#e1eaf2" font-weight="500" text-anchor="end">23,954건</text><text x="100" y="266" font-size="14" fill="#9fb1c4" font-weight="400" text-anchor="start">0</text><text x="450" y="266" font-size="14" fill="#9fb1c4" font-weight="400" text-anchor="end">25,000건</text><text x="30" y="300" font-size="22" fill="#e1eaf2" font-weight="600" text-anchor="start">요청당 평균 입력</text><text x="585" y="300" font-size="20" fill="#7ad5bd" font-weight="600" text-anchor="end">약 19배</text><text x="30" y="348" font-size="18" fill="#9fb1c4" font-weight="400" text-anchor="start">6월</text><rect x="100" y="330" width="350" height="26" rx="3" fill="#243442"/><rect x="100" y="330" width="17.528" height="26" rx="3" fill="#496573"/><text x="585" y="350" font-size="18" fill="#e1eaf2" font-weight="500" text-anchor="end">5,008토큰</text><text x="30" y="395" font-size="18" fill="#9fb1c4" font-weight="400" text-anchor="start">11월</text><rect x="100" y="377" width="350" height="26" rx="3" fill="#243442"/><rect x="100" y="377" width="326.8755" height="26" rx="3" fill="#7ad5bd"/><text x="585" y="397" font-size="18" fill="#e1eaf2" font-weight="500" text-anchor="end">93,393토큰</text><text x="100" y="451" font-size="14" fill="#9fb1c4" font-weight="400" text-anchor="start">0</text><text x="450" y="451" font-size="14" fill="#9fb1c4" font-weight="400" text-anchor="end">100,000토큰</text><text x="30" y="485" font-size="22" fill="#e1eaf2" font-weight="600" text-anchor="start">응답 시간 p95</text><text x="585" y="485" font-size="20" fill="#7ad5bd" font-weight="600" text-anchor="end">108초 → 17초</text><text x="30" y="533" font-size="18" fill="#9fb1c4" font-weight="400" text-anchor="start">6월</text><rect x="100" y="515" width="350" height="26" rx="3" fill="#243442"/><rect x="100" y="515" width="315.0" height="26" rx="3" fill="#496573"/><text x="585" y="535" font-size="18" fill="#e1eaf2" font-weight="500" text-anchor="end">108초</text><text x="30" y="580" font-size="18" fill="#9fb1c4" font-weight="400" text-anchor="start">11월</text><rect x="100" y="562" width="350" height="26" rx="3" fill="#243442"/><rect x="100" y="562" width="49.58333333333333" height="26" rx="3" fill="#7ad5bd"/><text x="585" y="582" font-size="18" fill="#e1eaf2" font-weight="500" text-anchor="end">17초</text><text x="100" y="636" font-size="14" fill="#9fb1c4" font-weight="400" text-anchor="start">0</text><text x="450" y="636" font-size="14" fill="#9fb1c4" font-weight="400" text-anchor="end">120초</text><text x="30" y="690" font-size="16" fill="#9fb1c4" font-weight="400" text-anchor="start">모델·입력·트래픽도 바뀌었으므로 개별 수정의 효과로 해석하지 않는다.</text></g></svg>